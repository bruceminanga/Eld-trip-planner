apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: frontend-dev
namePrefix: dev-

resources:
  - ../../base/ # Ensure this points directly to where base kustomization.yaml is
  - namespace.yaml
  - ingress.yaml

configMapGenerator:
  - name: backend-config
    literals:
      - DEBUG=True
      - ALLOWED_HOSTS=*

      - DB_HOST=dev-postgres # ◄── FIX
      - DB_PORT=5432 # ◄── FIX
      - DB_NAME=mydb # ◄── FIX
      - DB_USER=myuser

      - POSTGRES_DB=mydb
      - POSTGRES_USER=myuser
      - POSTGRES_HOST=dev-postgres
      - POSTGRES_PORT=5432
      - DJANGO_SUPERUSER_USERNAME=bruce
      - DJANGO_SUPERUSER_EMAIL=admin@example.com

secretGenerator:
  - name: backend-secret
    literals:
      - SECRET_KEY=any-local-secret-key-here
      - DB_PASSWORD=stronglocalpassword
      - POSTGRES_PASSWORD=stronglocalpassword
      - DJANGO_SUPERUSER_PASSWORD=stronglocalpassword

# Only inject labels UNIQUE to the 'dev' environment:
labels:
  - pairs:
      app.kubernetes.io/instance: frontend-dev
      environment: dev
    includeTemplates: true
