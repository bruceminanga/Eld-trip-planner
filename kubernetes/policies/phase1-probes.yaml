apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-probes-and-grace-period
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-liveness-and-readiness
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                [
                  kube-system,
                  monitoring,
                  argocd,
                  kyverno,
                  kube-node-lease,
                  kube-public,
                  external-secrets,
                ]
      validate:
        message: "Every container must define both readinessProbe and livenessProbe."
        pattern:
          spec:
            containers:
              - readinessProbe: {}
                # livenessProbe: {}

    - name: distinct-liveness-readiness
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                [
                  kube-system,
                  monitoring,
                  argocd,
                  kyverno,
                  kube-node-lease,
                  kube-public,
                  external-secrets,
                ]
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[0].livenessProbe.httpGet.path || '' }}"
            operator: NotEquals
            value: ""
          - key: "{{ request.object.spec.containers[0].readinessProbe.httpGet.path || '' }}"
            operator: NotEquals
            value: ""
      validate:
        message: "Liveness and Readiness probes must not share the exact same HTTP path. Liveness must not check external dependencies."
        deny:
          conditions:
            all:
              - key: "{{ request.object.spec.containers[0].livenessProbe.httpGet.path }}"
                operator: Equals
                value: "{{ request.object.spec.containers[0].readinessProbe.httpGet.path }}"

    - name: require-termination-grace-period
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                [
                  kube-system,
                  monitoring,
                  argocd,
                  kyverno,
                  kube-node-lease,
                  kube-public,
                  external-secrets,
                ]
      validate:
        message: "Workloads must configure terminationGracePeriodSeconds (>0) for graceful shutdown."
        pattern:
          spec:
            =(terminationGracePeriodSeconds): ">0"
