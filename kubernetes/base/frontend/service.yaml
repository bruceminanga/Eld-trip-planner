# Kubernetes/base/frontend/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: frontend-service # Other pods can reach this by DNS: http://frontend-service
spec:
  # ClusterIP means internal access only (not directly exposed to the public internet).
  # External traffic typically hits an Ingress Controller, which routes here.
  type: ClusterIP

  ports:
    - name: http
      port: 80 # Port the Service listens on internally (inside the cluster network)
      targetPort: 8080 # Port the actual application container is listening on

  # Routing target:
  # The Service will load-balance traffic to any Pod in this namespace that has BOTH of these labels:
  selector:
    app.kubernetes.io/name: M-treat-project
    app.kubernetes.io/component: frontend
