name: Professional CI/CD Pipeline

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"

# Least privilege: read-only by default across all jobs
permissions:
  contents: read

jobs:
  # =========================================================
  # JOB 1: Continuous Integration (Runs on PRs AND pushes)
  # =========================================================
  ci-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Validate Docker builds without pushing (uses GitHub Actions cache for speed)
      - name: Validate Backend Docker build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Frontend Docker build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================
  # JOB 2: Build & Push Images (Runs ONLY on push to master)
  # =========================================================
  cd-build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: ci-build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eld-trip-planner-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eld-trip-planner-backend:${{ github.sha }}
          cache-from: type=gha

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eld-trip-planner-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eld-trip-planner-frontend:${{ github.sha }}
          cache-from: type=gha

  # =========================================================
  # JOB 3: GitOps Manifest Update (Triggers ArgoCD sync)
  # =========================================================
  update-manifests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: cd-build-and-push
    runs-on: ubuntu-latest
    # Write permission scoped ONLY to this job
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update Backend & Frontend Image Tags
        env:
          IMAGE_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cd kubernetes/overlays/dev
          kustomize edit set image ${IMAGE_OWNER}/eld-trip-planner-backend=${IMAGE_OWNER}/eld-trip-planner-backend:${{ github.sha }}
          kustomize edit set image ${IMAGE_OWNER}/eld-trip-planner-frontend=${IMAGE_OWNER}/eld-trip-planner-frontend:${{ github.sha }}

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add kubernetes/overlays/dev/kustomization.yaml
          if ! git diff --staged --quiet; then
            git commit -m "ci: update image tags to ${{ github.sha }}"
            git push
          else
            echo "No image tag changes to commit."
          fi
